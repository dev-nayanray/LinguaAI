name: CI

# DEPLOYMENT.md §4: runs on every PR. Also on push to main (the merge
# commit differs from what the PR branch tested, per CONTRIBUTING.md's
# "no direct pushes to main" — squash/merge commits deserve their own
# run) and workflow_dispatch for manual re-runs.
#
# Every `uses:` below is pinned to a full commit SHA, not a mutable tag
# (T20 semgrep finding, yaml.github-actions.security.github-actions-
# mutable-action-tag) — floating tags can be silently repointed by the
# action owner, a real supply-chain vector semgrep's own finding cites
# precedent for. The trailing `# vN` comment is a human-readable label
# only; the SHA is what actually pins the content.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-sensitive local-dev placeholders, matching .env.example.
  # packages/database's `prisma generate` (part of the `build` pipeline's
  # db:generate dependency, turbo.json) needs a syntactically valid
  # DATABASE_URL to validate the schema — it never opens a live
  # connection, so no Postgres service container is needed here.
  # REDIS_URL is set for the same reason, should any package start
  # validating packages/config's schema during build/test.
  DATABASE_URL: postgresql://linguaai:linguaai_dev_password@localhost:5432/linguaai
  REDIS_URL: redis://localhost:6379

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # E1 Part 5: local + CI-native caching only for E1 (remote caching
      # deliberately deferred, tracked as a future decision once real
      # usage data justifies it). This persists Turborepo's own
      # content-addressable cache directory between runs — turbo still
      # does its own per-task input hashing once restored, so this key
      # only needs to be "close enough" to a recent run, not exact.
      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Not in DEPLOYMENT.md §4's listed steps, but TESTING.md §8 treats
      # CI checks as required and non-bypassable — the pre-commit
      # lint-staged hook already runs Prettier, but a hook can be
      # skipped locally (--no-verify), so this is the same
      # defense-in-depth pattern SECURITY.md uses for secret scanning
      # (pre-commit hook + repeated in CI).
      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # E4 T11 (interim — MULTITENANCY.md §6, docs/epics/
      # E4-database-schema-core-data-layer.md §10 resolved item 1): static
      # analysis over migration SQL only, no database needed. Real gate is
      # the "database-migrations" job below applying every migration to a
      # genuinely fresh database — this step just confirms every
      # tenant-scoped (organizationId-bearing) table found in that history
      # also has an RLS policy.
      - name: RLS policy lint
        run: pnpm --filter @linguaai/database run lint:rls

  # E4 T11: migration dry-run gate — every migration must apply cleanly to
  # a genuinely fresh database, not just the long-lived local dev database
  # every migration in this repo has so far only ever been tested against.
  # Builds the same pgvector+pg_partman image local dev uses
  # (infrastructure/docker/postgres/Dockerfile), not the bare
  # pgvector/pgvector:pg16 base image — AIMessage/LearningEvent/AIUsageLog's
  # partitioning migrations call pg_partman functions that don't exist
  # without it. Deliberately not a `services:` container: GitHub Actions
  # starts `services:` before any step runs in the same job, so a locally
  # built image can't be referenced there — built and run as explicit
  # `docker` steps instead.
  database-migrations:
    name: Database migration dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local Postgres image (pgvector + pg_partman)
        run: docker build -t linguaai-postgres:ci ./infrastructure/docker/postgres

      - name: Start a fresh Postgres container
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=linguaai \
            -e POSTGRES_PASSWORD=linguaai_dev_password \
            -e POSTGRES_DB=linguaai \
            -p 5432:5432 \
            linguaai-postgres:ci
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U linguaai && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      # Mirrors infrastructure/docker/postgres-init's two init scripts —
      # those only run on a container's first-ever start against an empty
      # data directory, which this freshly-created container is, but
      # replicated explicitly here rather than relying on that timing.
      - name: Enable required extensions
        run: |
          docker exec ci-postgres psql -U linguaai -d linguaai -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec ci-postgres psql -U linguaai -d linguaai -c "CREATE EXTENSION IF NOT EXISTS citext;"
          docker exec ci-postgres psql -U linguaai -d linguaai -c "CREATE SCHEMA IF NOT EXISTS partman; CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;"

      - name: Apply every migration to the fresh database
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://linguaai:linguaai_dev_password@localhost:5432/linguaai
        run: pnpm run db:migrate:deploy

      - name: Stop Postgres container
        if: always()
        run: docker rm -f ci-postgres || true

  # E3 T15: @storybook/test-runner harness (interaction smoke tests +
  # @storybook/addon-a11y's axe checks, wired via preview.tsx's
  # `a11y.test = 'error'`) — a separate job from `ci` above since it needs
  # a Playwright browser instead of jsdom, and only packages/ui has stories
  # today.
  #
  # E3 T16 (§17's "Accessibility (automated): axe on every story, every
  # theme" row) adds the second, dark-mode pass below: `preview.tsx` reads
  # `STORYBOOK_THEME` (Storybook's own env-var-passthrough convention) to
  # pick the story's *initial* theme, so `test-storybook:ci:dark` builds a
  # second Storybook instance that starts every story in dark mode and runs
  # the identical addon-a11y mechanism against it — the same proven
  # mechanism run twice, not a second bespoke per-story theme-toggle.
  storybook-tests:
    name: Storybook interaction + a11y tests (packages/ui)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @linguaai/ui exec playwright install --with-deps chromium

      - name: Build Storybook (light theme), serve it, and run the test-runner against it
        run: pnpm --filter @linguaai/ui test-storybook:ci

      - name: Build Storybook (dark theme), serve it, and run the test-runner against it
        run: pnpm --filter @linguaai/ui test-storybook:ci:dark
